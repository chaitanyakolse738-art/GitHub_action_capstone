name: main pipeline

on:
  push:
    branches: ["main"]

jobs:
  
    build-and-test:
        uses: ./.github/workflows/reusable-build-test.yml
        with:
          python_version: '3.12'
          run_tests: true

    docker-build-and-push:
        needs: build-and-test
        uses: ./.github/workflows/reusable-docker.yml
        with:
          image_name: devops-health-api
        secrets: inherit
          
     
    deploy:
       needs: docker-build-and-push
       runs-on: ubuntu-latest
       environment:
         name: production

       steps:
          - name: image output print
            run: |
              echo "Docker image URL: ${{ needs.docker-build-and-push.outputs.image_url }}"
